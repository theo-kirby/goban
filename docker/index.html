<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Goban Sandbox — 3D Go</title>
        <script>
            /* Apply the stored (or OS) theme before first paint, so the page
             * never flashes the wrong palette. Mirrors initialTheme() in
             * examples/main.tsx. */
            (function () {
                var t = null;
                try {
                    t = window.localStorage.getItem("sandbox.theme");
                } catch (e) {
                    /* storage unavailable */
                }
                if (t !== "light" && t !== "dark") {
                    t =
                        window.matchMedia &&
                        window.matchMedia("(prefers-color-scheme: light)").matches
                            ? "light"
                            : "dark";
                }
                document.documentElement.setAttribute("data-theme", t);
            })();
        </script>
        <link rel="stylesheet" href="/examples.css" />
    </head>
    <body>
        <div id="test-content"></div>
        <script src="/sandbox.min.js"></script>
    </body>
</html>
